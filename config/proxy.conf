# ==============================================================================
# simple-proxy · 配置
#
# 修改后重新执行一次 `simple-proxy on ...` 即可生效（每次启动会重新生成运行时配置）。
# 所有项都可以用同名环境变量覆盖（便于临时测试）。
# ==============================================================================

# HTTP 代理端口（只开 HTTP，不开 SOCKS）
SP_HTTP_PORT=7890

# 日志保留天数（按天轮转，超过则删除）
SP_LOG_KEEP_DAYS=3

# mihomo 内核版本（install 时下载）
SP_MIHOMO_VERSION=1.19.33

# 是否开启 mihomo 的控制 API（127.0.0.1:9090）
#   0 = 关闭（默认，减少暴露面；代价是无法交互式切换节点）
#   1 = 开启
SP_ENABLE_API=0

# DNS 备用解析器（首选系统解析器 /etc/resolv.conf，其次这些）
#   中国大陆网络可改为境内 DoH，避免境外 DoH 直连不通：
#     SP_DNS_FALLBACKS="https://doh.pub/dns-query https://dns.alidns.com/dns-query"
SP_DNS_FALLBACKS="https://1.1.1.1/dns-query https://8.8.8.8/dns-query"

# 客户端 NO_PROXY 追加项（这些目标不经过代理）
#   内网网段请保留；主机名与网段都要写：
#   部分老版本 curl(<7.86) 不支持 NO_PROXY 里的 CIDR
SP_NO_PROXY_EXTRA="localhost,127.0.0.1,.svc,.svc.cluster.local,10.0.0.0/8,10.42.0.0/16,10.43.0.0/16,10.254.0.0/16,10.255.0.0/16"
